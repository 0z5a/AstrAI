name: First batch integration

on:
  push:
    branches: [test/rl-first-batch-integration]

permissions:
  contents: read

jobs:
  cpu:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      CUDA_VISIBLE_DEVICES: ''
      OMP_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned project dependencies
        run: python -m pip install '.[dev]'
      - name: Record source and environment
        run: |
          mkdir results
          git rev-parse HEAD > results/source-sha.txt
          python -m pip freeze --all > results/dependencies.txt
          python -c 'import torch; print(torch.__version__); assert torch.__version__.split("+")[0] == "2.11.0"; assert not torch.cuda.is_available()' > results/torch.txt
      - name: Check formatting and imports
        run: |
          python -m ruff format --check .
          python -m ruff check . --select I
      - name: Full CPU suite
        run: python -u -m pytest tests/ -v --junitxml=results/full.xml > results/full.log 2>&1
      - name: Keep validation evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: first-batch-cpu-results
          path: results/
          retention-days: 14
